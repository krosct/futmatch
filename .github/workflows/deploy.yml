name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Testes e Verificação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke test de inicialização da API
        run: python -c "import app.main; print('FutMatch backend OK')"

      - name: Testes unitários e de API (pytest)
        run: python -m pytest -q

  e2e:
    name: E2E no navegador (Chrome)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Instalar dependências do backend
        run: pip install -r requirements.txt

      - name: Instalar dependências do E2E
        working-directory: tests/e2e
        run: npm ci

      - name: Subir o servidor de teste
        run: |
          mkdir -p "$RUNNER_TEMP/futmatch-data"
          DATA_DIR="$RUNNER_TEMP/futmatch-data" nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 4797 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4797/healthz && break; sleep 1; done

      - name: Executar o E2E (Chrome do runner)
        working-directory: tests/e2e
        env:
          BASE_URL: http://127.0.0.1:4797
          CHROME_PATH: /usr/bin/google-chrome
        run: node e2e.mjs

      - name: Log do servidor em caso de falha
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  deploy:
    name: Deploy na VPS
    needs: [test, e2e]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: krosct/devkit@dd7e032a682c02d92ba90f39ef6b42efa4321af4 # v1.3.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          path: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          domain: ${{ secrets.DEPLOY_SITE_ADDRESS || vars.DEPLOY_SITE_ADDRESS || 'futmatch.gms.xyz.br' }}
          origin-cert: ${{ secrets.DEPLOY_ORIGIN_CERT }}
          origin-key: ${{ secrets.DEPLOY_ORIGIN_KEY }}
          preserve: ${{ secrets.DEPLOY_PRESERVE || vars.DEPLOY_PRESERVE }}
          env: |
            DATA_DIR=/srv/futmatch/data
