# FutMatch specifics for devkit (https://github.com/krosct/devkit)
APP=futmatch
DEV="uv venv -q --allow-existing .venv --python 3.12 && uv pip install -q --python .venv/bin/python -r requirements.txt && exec .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --reload"
INSTALL="uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
RUN=".venv/bin/uvicorn app.main:app --host 127.0.0.1 --port {port} --workers 1 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-server-header --no-access-log --timeout-keep-alive 5"
HEALTH=/healthz
SERVICE_ENV="DATA_DIR={data} PUBLIC_URL={url} PYTHONUNBUFFERED=1"
